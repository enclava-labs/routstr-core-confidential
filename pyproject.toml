[project]
name = "routstr"
version = "0.4.3"
description = "Payment proxy for your LLM endpoint using cashu and nostr."
readme = "README.md"
requires-python = ">=3.11"

dependencies = [
    "fastapi[standard]>=0.138.0",
    "aiosqlite>=0.20",
    "sqlmodel>=0.0.24",
    "httpx[socks]>=0.25.2",
    "greenlet>=3.2.1",
    "alembic>=1.13",
    "python-json-logger>=2.0.0",
    "cashu>=0.20",
    "marshmallow>=3.13,<4.0",
    "websockets>=12.0",
    "nostr>=0.0.2",
    "mdurl==0.1.2",
    "pillow>=10",
    "openai>=1.98.0",
    "litellm>=1.89.3",
    "python-dotenv>=1.0",
    "python-multipart>=0.0.32",
]

[dependency-groups]
dev = [
    "mypy>=1.15.0",
    "ruff>=0.11.6",
    "openai>=1.76.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.1.1",
    "httpx>=0.25.2",
    "psutil>=5.9.0",
    "aiohttp>=3.9.0",
    "pytest-benchmark>=4.0.0",
    "routstr",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = [
    "-v",
    "--tb=short",
    "--strict-markers",
    "--disable-warnings",
    "-p",
    "no:warnings",
]
markers = [
    "asyncio: marks tests as async (deselect with '-m \"not asyncio\"')",
    "integration: marks tests as integration tests (deselect with '-m \"not integration\"')",
    "unit: marks tests as unit tests",
    "slow: marks tests as slow running (deselect with '-m \"not slow\"')",
    "requires_real_mint: marks tests that require a running Cashu mint instance",
    "requires_docker: marks tests that require Docker services running (deselect with '-m \"not requires_docker\"')",
    "performance: marks tests that measure performance metrics",
]

[build-system]
requires = ["setuptools>=78.1.1", "wheel>=0.46.2"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["routstr*"]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]
exclude = ["examples"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
disallow_untyped_defs = true
check_untyped_defs = true
disallow_untyped_calls = true
disallow_incomplete_defs = true
disallow_untyped_decorators = true
# Strict type-checking covers the shipped package only. Tests, scripts,
# migrations and examples are not part of the runtime artifact: tests rely on
# untyped fixtures/mocks, scripts are operational tooling, and alembic
# migrations reference dynamically-defined ``sa.sql`` symbols mypy cannot see.
# ponytail: widen this list back to [] only if/when test typing is enforced.
exclude = [
    "tests/",
    "scripts/",
    "migrations/",
    "examples/",
    "verifiers/",
    "build-docs.sh",
    "build/",
    "dist/",
]

[tool.uv]
# cashu 0.20.1 is still the latest release and pins several vulnerable
# runtime/build packages (cryptography<44, fastapi<0.116, h11<0.15, httpx<0.26,
# importlib-metadata<7, setuptools<76, wheel<0.42, and the deprecated ecdsa).
# These overrides force current, patched versions instead. As a consequence
# `uv pip check` reports ~8 cashu incompatibilities BY DESIGN; they are not
# runtime errors (the full test suite passes) and cashu has no newer release
# to relax them. Keep this block centralized until cashu relaxes those caps
# or Routstr moves to a different Cashu client.
#
# Install path: this package is distributed as the Docker image
# ghcr.io/enclava-labs/routstr-core-confidential, built with `uv sync` (which
# honors these overrides). Plain `pip install` from the wheel is NOT
# satisfiable because pip ignores [tool.uv] overrides.
exclude-dependencies = [
    "ecdsa",
]
override-dependencies = [
    "cryptography>=48.0.1",
    "fastapi>=0.138.0",
    "h11>=0.16.0",
    "httpx>=0.28.0",
    "importlib-metadata>=8.0.0,<9.0",
    "setuptools>=78.1.1",
    "wheel>=0.46.2",
]

[tool.uv.sources]
routstr = { workspace = true }
